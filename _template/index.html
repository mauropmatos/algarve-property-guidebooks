/* =====================================================================
   LOADING. Reads the client's sheet, keeps the last good copy on the
   phone for weak signal, checks which photos exist, then calls boot().
   ===================================================================== */
// Full CSV reader: quoted cells, commas, quotes and line breaks inside a cell.
// Column A is the key, column B the value. SECTION rows and the header are skipped.
function parseSheet(text){
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ","){ row.push(f); f = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f !== "" || row.length){ row.push(f); rows.push(row); }
  const d = {};
  rows.forEach(r => { const k = String(r[0] || "").trim(); if (k && k !== "key" && !/^SECTION:/i.test(k)) d[k] = String(r[1] || "").trim(); });
  return d;
}
// The template reads new key names first and falls back to the older ones,
// so a client sheet keeps working before its new rows are added.
function normalise(raw, gone){
  gone = gone || new Set();
  const d = {};
  Object.keys(raw || {}).forEach(k => { const v = raw[k]; d[k] = typeof v === "string" ? v.trim() : v; });
  const has = k => d[k] != null && String(d[k]).trim() !== "";
  const first = (...ks) => { for (const k of ks) if (has(k)) return d[k]; return ""; };
  const up = x => x ? x.charAt(0).toUpperCase() + x.slice(1) : x;
  if (!has("host_name")){
    const parts = String(d.contact_primary_name || "").split(/\s+[—–-]\s+/);
    d.host_name = (parts[0] || "").trim();
    if (!has("host_role") && parts[1]) d.host_role = parts.slice(1).join(" — ").trim();
  }
  d.nameless = !has("host_name");
  if (d.nameless) d.host_name = "your host";
  d.host_role = up(first("host_role")) || "Your host";
  d.host_note = first("host_note", "host_availability");
  d.early_arrival_note = first("early_arrival_note", "flexibility");
  d.late_checkout = first("late_checkout", "flexibility");
  d.luggage_checkout = first("luggage_checkout", "luggage_storage");
  if (!has("included")) d.included = String(d.included_items || "").split(/\s*,\s*/).filter(Boolean).join(" | ");
  d.shutters_windows = [d.shutters_windows, d.electric_shutters].filter(x => x && String(x).trim()).join(" ");
  // International digits for WhatsApp and tap to call: +351…, 00351…, (0044)… or a bare nine-digit Portuguese number.
  const intl = v => { let n = String(v || "").replace(/[^\d+]/g, ""); if (n.charAt(0) === "+") n = n.slice(1); else if (n.slice(0, 2) === "00") n = n.slice(2); else if (/^\d{9}$/.test(n)) n = "351" + n; return n; };
  d.whatsapp_number = intl(first("whatsapp_number", "contact_primary_phone", "host_phone"));
  d.contact_owner_phone_intl = intl(d.contact_owner_phone);
  if (!has("emergency")) d.emergency = "112 (general emergency) | SNS 24 health line: 808 24 24 24";
  // A GPS cell may hold coordinates rather than a link.
  if (/^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(d.gps || "")) d.gps = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(d.gps.replace(/\s+/g, ""));
  else if (!has("gps") && has("address")) d.gps = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(d.address);
  // Photos: the demos carry them inline; client pages use files in their own folder.
  if (!has("hero")) d.hero = IMG && !gone.has(IMG + "hero.jpg") ? IMG + "hero.jpg" : "";
  if (!has("host_photo")) d.host_photo = IMG && !gone.has(IMG + "host.jpg") ? IMG + "host.jpg" : "";
  d.photos = photoList(d).filter(p => p[0] === "@hero" ? d.hero : !gone.has(p[0]));
  return new Proxy(d, {get: (t, k) => typeof k === "symbol" ? t[k] : (t[k] == null ? "" : t[k])});
}
// photos cell: "living-room — Living room | terrace — The terrace". Empty = the standard set.
function photoList(d){
  if (Array.isArray(d.photos)) return d.photos;
  const custom = String(d.photos || "").split(/\s*\|\s*/).filter(Boolean).map(x => x.split(/\s+[—–]\s+/).map(y => y.trim()));
  const list = custom.length ? custom : [["living-room", "Living room"], ["kitchen", "Kitchen"], ["bedroom", "Bedroom"], ["bathroom", "Bathroom"], ["terrace", "Terrace"], ["exterior", "Outside"], ["hero", ""]];
  return list.map(([f, c]) => {
    const name = String(f || "").replace(/^.*\//, "");
    if (name.replace(/\.\w+$/, "") === "hero") return ["@hero", c || String(d.property_name || "")];
    return [IMG + (/\.(jpe?g|png|webp|avif)$/i.test(name) ? name : name + ".jpg"), c || name.replace(/\.\w+$/, "").replace(/[-_]+/g, " ").replace(/^./, m => m.toUpperCase())];
  });
}
// Which photo files are definitely missing (404). Slow or offline checks count as present.
function probe(urls, ms){
  const gone = new Set();
  const checks = urls.filter(u => u && !/^data:/.test(u)).map(u => fetch(u, {method: "HEAD"}).then(r => { if (r.status === 404 || r.status === 410) gone.add(u); }).catch(() => {}));
  return Promise.race([Promise.all(checks), new Promise(ok => setTimeout(ok, ms))]).then(() => gone);
}
function expired(d){
  const m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(String(d.expiry_date || "").trim());
  if (!m) return false;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return today > new Date(+m[1], +m[2] - 1, +m[3]);
}
(function start(){
  const box = document.getElementById("gp-boot"), msg = document.getElementById("gp-boot-msg"), retry = document.getElementById("gp-retry");
  const done = () => { box.hidden = true; };
  const fail = (html, again) => { box.classList.add("is-error"); msg.innerHTML = html; retry.hidden = again === false; };
  retry.addEventListener("click", () => location.reload());
  if (EMBED){ boot(normalise(EMBED)); done(); return; }
  // Written in two parts so the find-and-replace that sets up a client page can't change this check.
  if (SHEET_URL.indexOf("REPLACE-" + "SHEET-ID") !== -1) return fail("This guide isn't set up yet.", false);
  const KEY = "gp2." + SCOPE + ".sheet";
  let cached = null;
  try { const c = JSON.parse(localStorage.getItem(KEY) || "null"); cached = c && c.data; } catch (e) {}
  // A sheet that isn't shared returns Google's sign-in page, not CSV, so check it looks like a property sheet.
  const fresh = fetch(SHEET_URL, {cache: "no-store"})
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(t => { const d = parseSheet(t); if (!d.property_name && Object.keys(d).length < 5) throw new Error("Not a property sheet"); try { localStorage.setItem(KEY, JSON.stringify({at: Date.now(), data: d})); } catch (e) {} return d; });
  fresh.catch(() => {});
  // With a saved copy, wait 4 seconds for the sheet, then open the saved copy. Without one, wait longer.
  const wait = new Promise((ok, no) => setTimeout(() => no(new Error("timeout")), cached ? 4000 : 20000));
  Promise.race([fresh, wait]).catch(() => cached).then(async data => {
    if (!data) return fail("This guide couldn't load. Check your connection, then try again.");
    if (expired(data)) return fail(`<span lang="pt">Esta página expirou, contacte o seu anfitrião.</span><br>This guide has expired. Please contact your host.`, false);
    const urls = [IMG + "hero.jpg", IMG + "host.jpg"].concat(photoList(data).map(p => p[0]).filter(u => u !== "@hero"));
    const gone = await probe(urls, 2500);
    try { boot(normalise(data, gone)); done(); }
    catch (e) { console.error(e); fail("Something went wrong opening this guide. Please try again."); }
  });
})();
