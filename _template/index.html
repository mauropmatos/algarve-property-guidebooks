<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1C5C">
<meta name="robots" content="noindex">
<title>Guest guide</title>
<!-- GuestPage Algarve guest guide, template v2 (built from the prototype, Nov 2026).
     A client page is a copy of this file with two changes, both in the PER-CLIENT SETTINGS
     block in the script: the Sheet ID in SHEET_URL, and REPLACE-SLUG in IMG.
     Photos live in /clients/<slug>/assets/images/: hero.jpg, optional host.jpg, and the
     gallery files named in the sheet's photos row (or the standard set). -->
<style>body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
.gp-boot{position:fixed;inset:0;z-index:200;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;font-family:var(--font);font-size:17px;line-height:1.5}
.gp-boot[hidden]{display:none}
.gp-spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:gpspin .9s linear infinite}
.gp-boot.is-error .gp-spin{display:none}
.gp-retry{width:auto;padding:12px 28px}
@keyframes gpspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.gp-spin{animation:none}}
/* Layout: app shell. Navy bar fixed on top (clear over the Home photo, solid elsewhere), five tabs fixed at the bottom, one tab's content between them. */
:root{
  --bg:#FFFFFF; --fg:#17182B; --muted:#5E6176; --line:#E4E5EC; --surface:#F4F5F9;
  --brand:#1C1C5C; --sky:#1AA3DC; --link:#1C1C5C; --mark:#D9F0FA; --focus:#1AA3DC;
  --bar:#1C1C5C; --on-bar:#FFFFFF;
  --btn-bg:#1C1C5C; --btn-fg:#FFFFFF;
  --scrim:rgba(12,13,24,.45); --shadow:rgba(20,22,60,.16);
  --hero-top:rgba(10,10,35,.50); --hero-mid:rgba(28,28,92,.55); --hero-bottom:rgba(28,28,92,.94); --photo-shadow:rgba(0,0,0,.35); --on-photo:#FFFFFF; --on-photo-soft:rgba(255,255,255,.86);
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --body:17px; --small:15px; --h1:30px; --h2:20px; --radius:16px;
  --bar-h:52px;
  --wa:#25D366; --on-wa-fab:#073B30; --wa-btn:#0B6B5E; --on-wa:#FFFFFF; --switch-off:#80839A;
  --wm-guest:#1C1C5C; --wm-page:#1AA3DC;
  --tip-bg:#EEF7FC; --tip-line:#D3E7F2;
  --lb-bg:#08080D; --lb-fg:#FFFFFF; --lb-btn:rgba(255,255,255,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111218; --fg:#ECEDF3; --muted:#A3A6B9; --line:#2A2C39; --surface:#1B1C27;
    --brand:#C3C5F5; --sky:#55C4EE; --link:#C3C5F5; --mark:#173E52; --focus:#55C4EE;
    --bar:#1A1B45; --btn-bg:#C3C5F5; --btn-fg:#111218; --shadow:rgba(0,0,0,.5); --wm-guest:#ECEDF3; --wm-page:#55C4EE; --tip-bg:#13263A; --tip-line:#24405A; --switch-off:#6E7290; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111218; --fg:#ECEDF3; --muted:#A3A6B9; --line:#2A2C39; --surface:#1B1C27;
  --brand:#C3C5F5; --sky:#55C4EE; --link:#C3C5F5; --mark:#173E52; --focus:#55C4EE;
  --bar:#1A1B45; --btn-bg:#C3C5F5; --btn-fg:#111218; --shadow:rgba(0,0,0,.5); --wm-guest:#ECEDF3; --wm-page:#55C4EE; --tip-bg:#13263A; --tip-line:#24405A; --switch-off:#6E7290; color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
.gut{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.col{max-width:640px;margin:0 auto}
a{color:var(--link);text-underline-offset:3px}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
svg{flex:none}
p{margin:0 0 12px}
p:last-child{margin-bottom:0}

/* App bar */
.appbar{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:var(--bar);color:var(--on-bar);transition:background-color .25s ease, box-shadow .25s ease}
.appbar .col{height:var(--bar-h);display:flex;align-items:center;gap:6px}
.appbar-title{flex:1;min-width:0;font-size:17px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s ease}
.ibtn{width:44px;height:44px;border-radius:999px;border:0;background:transparent;color:var(--on-bar);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background-color .2s ease}
.ibtn svg{width:22px;height:22px}
.hbtn{height:40px;margin-left:4px;padding:0 14px 0 11px;border-radius:999px;border:1.5px solid var(--on-photo-soft);background:transparent;color:var(--on-bar);display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background-color .2s ease}
.hbtn svg{width:17px;height:17px}
.appbar.clear .hbtn{background:var(--hero-top)}
.appbar.clear{background:transparent}
.appbar.clear .appbar-title{opacity:0}
.appbar.clear .ibtn{background:var(--hero-top)}

/* Home cover */
.cover{position:relative;height:clamp(320px, 54vh, 500px);background:var(--bar);overflow:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom, var(--hero-top) 0%, transparent 22%, transparent 32%, var(--hero-mid) 58%, var(--hero-bottom) 100%)}
@media (max-height:700px){.cover{height:clamp(260px, 46vh, 340px)}}
.cover-text{position:absolute;left:0;right:0;bottom:44px;z-index:1;color:var(--on-photo);text-shadow:0 1px 14px var(--photo-shadow)}
.cover-kicker{font-size:15px;color:var(--on-photo-soft);margin:0 0 2px}
.cover h1{font-size:36px;line-height:1.08;letter-spacing:-0.025em;margin:0;color:var(--on-photo);text-wrap:balance}
.cover-meta{font-size:15px;color:var(--on-photo-soft);margin:6px 0 0}
.searchpill{position:relative;z-index:2;margin-top:-26px;width:100%;display:flex;align-items:center;gap:10px;font-size:var(--body);color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:14px 18px;box-shadow:0 8px 24px var(--shadow);cursor:text;text-align:left}
.searchpill svg{width:20px;height:20px;color:var(--fg)}
.searchpill span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Panels */
.panel-pad{padding-top:calc(var(--bar-h) + env(safe-area-inset-top,0px) + 22px)}
.pbody{padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))}
.head{margin-bottom:6px}
h1{font-size:var(--h1);line-height:1.15;letter-spacing:-0.02em;margin:0 0 4px;font-weight:700;text-wrap:balance}
.meta{color:var(--muted);margin:0}
.block{margin-top:34px}
h2{font-size:var(--h2);line-height:1.25;margin:0 0 10px;font-weight:600;letter-spacing:-0.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:var(--small);margin:-4px 0 12px}
.small{font-size:var(--small);color:var(--muted)}

/* Essentials: the one card */
.essentials{background:var(--surface);border-radius:var(--radius);padding:2px 16px;margin-top:20px}
.ess{display:flex;align-items:baseline;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);min-height:52px}
.ess:last-child{border-bottom:0}
.ess-k{width:84px;flex:none;color:var(--muted);font-size:var(--small);line-height:1.5}
/* Very small phones: label above the value, so addresses and passwords never break mid-word */
@media (max-width:359px){.ess{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:2px}.ess-k{grid-column:1 / -1;width:auto;padding-top:0}.ess-v{grid-column:1}.ess .copy{grid-column:2;grid-row:2}}
.ess-v{flex:1;min-width:0;font-weight:600;overflow-wrap:break-word}
.ess-v a{display:block;width:max-content;font-size:var(--small);font-weight:600;padding:6px 0 4px;margin:0 0 -6px}
.copy{flex:none;font-size:13px;font-weight:600;color:var(--fg);background:var(--bg);border:1px solid var(--switch-off);border-radius:999px;padding:7px 13px;cursor:pointer;min-width:66px;min-height:40px}
a.copy{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.ess-note{display:block;font-size:var(--small);font-weight:400;color:var(--muted)}
.ess-inline{font-size:var(--small);font-weight:400;color:var(--muted)}
.ess-link{display:block;text-align:left;white-space:nowrap;background:none;border:0;padding:6px 0 4px;margin:0 0 -6px;font:inherit;font-size:var(--small);font-weight:600;color:var(--link);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.copy.done{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* Next step: the link from Home into the tabs */
.next{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px;cursor:pointer}
.next>svg:first-child{width:26px;height:26px;color:var(--brand)}
.next-t{font-weight:600}
.next-s{font-size:var(--small);color:var(--muted)}
.next>div{flex:1;min-width:0}
.next .arrow{width:20px;height:20px;color:var(--muted)}

/* Welcome */
.welcome-body > *{margin:10px 0 0}
.welcome-body > :first-child{margin-top:0}
.welcome:not(.open) .welcome-body > :first-child{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.welcome:not(.open) .welcome-body > :not(:first-child){display:none}
.textbtn{background:none;border:0;padding:12px 0;min-height:44px;font-size:var(--small);font-weight:600;color:var(--fg);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* Facts */
.facts{margin:0 0 14px;display:grid;gap:12px}
.facts div{display:grid;gap:1px}
.facts dt{color:var(--muted);font-size:var(--small)}
.facts dd{margin:0;font-weight:600}
.facts dd a{font-size:var(--small);display:inline-block;padding:8px 0;margin:-6px 0 -8px}

/* Steps */
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:10px}
.steps li::before{content:counter(s);font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
.keycards{display:grid;gap:12px;margin-top:14px}
.keycard{background:var(--surface);border-radius:var(--radius);padding:16px}
.key-h{display:flex;align-items:center;gap:12px}
.key-i{flex:none;width:40px;height:40px;border-radius:999px;background:var(--bg);color:var(--brand);display:flex;align-items:center;justify-content:center}
.key-i svg{width:22px;height:22px}
.key-n{font-weight:700;line-height:1.3}
.key-l{font-size:var(--small);color:var(--muted);line-height:1.4}
.key-steps{margin-top:14px;gap:10px}
.key-link{margin-top:14px}

/* Rows that open */
.rows{border-top:1px solid var(--line)}
details.row{border-bottom:1px solid var(--line)}
details.row>summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:1px;align-items:center;padding:15px 0;cursor:pointer}
details.row>summary::-webkit-details-marker{display:none}
.row-title{font-weight:600;grid-column:1}
.row-preview{grid-column:1;color:var(--muted);font-size:var(--small);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{grid-column:2;grid-row:1 / span 2;width:20px;height:20px;color:var(--muted);transition:transform .2s ease}
details[open]>summary .chev{transform:rotate(180deg)}
details[open]>summary .row-preview{display:none}
.row-body{padding:0 0 16px;max-width:62ch}

/* Places */
.places{border-top:1px solid var(--line)}
.row-body .places{border-top:0}
.place{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:14px;row-gap:2px;padding:13px 0;border-bottom:1px solid var(--line)}
.row-body .place:last-child{border-bottom:0}
.place-name{font-weight:600}
.place-desc{grid-column:1;color:var(--muted);font-size:var(--small)}
.maplink{grid-column:2;grid-row:1 / span 2;align-self:center;font-size:var(--small);font-weight:600;color:var(--fg);padding:12px 0 12px 14px;margin:-12px 0}
.more{margin-top:12px;font-size:var(--small);font-weight:600;color:var(--fg);background:var(--bg);border:1px solid var(--switch-off);border-radius:999px;padding:9px 16px;cursor:pointer;min-height:44px}

/* Lists */
.included{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 16px}
@media (max-width:429px){.included{grid-template-columns:1fr;gap:8px}}
.included li{position:relative;padding-left:22px;font-size:var(--small)}
.included li::before{content:"";position:absolute;left:3px;top:.45em;width:9px;height:5px;border-left:2px solid var(--brand);border-bottom:2px solid var(--brand);transform:rotate(-45deg)}
.bullets{margin:0 0 12px;padding-left:22px;display:grid;gap:6px}

/* Gallery: one big photo, three small, then the full-screen viewer */
.gallery{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;border-radius:var(--radius);overflow:hidden}
.g-tile{padding:0;border:0;background:var(--surface);cursor:pointer;display:block;min-width:0}
.g-tile img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover}
.g-tile:first-child{grid-column:1 / -1}
.g-tile:first-child img{aspect-ratio:16/10}
.g-all{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:7px 12px;min-height:40px;cursor:pointer;box-shadow:0 2px 8px var(--shadow)}
.g-all svg{width:16px;height:16px}
.lightbox{position:fixed;inset:0;z-index:60;background:var(--lb-bg);color:var(--lb-fg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lb-top,.lb-foot{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lb-top{height:56px}
.lb-foot{padding-block:10px 16px}
.lb-count,.lb-cap{font-size:15px;font-variant-numeric:tabular-nums}
.lb-btn{width:44px;height:44px;flex:none;border-radius:999px;border:0;background:var(--lb-btn);color:var(--lb-fg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.lb-btn svg{width:22px;height:22px}
.lb-nav{display:flex;gap:10px}
.lb-track{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.lb-track::-webkit-scrollbar{display:none}
.lb-slide{flex:0 0 100%;min-width:0;scroll-snap-align:center;display:flex;align-items:center;justify-content:center}
.lb-slide img{max-width:100%;max-height:100%;object-fit:contain}

/* WhatsApp */
/* One WhatsApp colour everywhere: WhatsApp green with a dark icon and text (6.3:1) */
.btn.wa{background:var(--wa);color:var(--on-wa-fab)}
.fab{position:fixed;z-index:24;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));min-width:56px;height:56px;padding:0 15px;border-radius:999px;background:var(--wa);color:var(--on-wa-fab);display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.fab svg{width:26px;height:26px;flex:none;stroke-width:2.1}
.fab-l{max-width:0;overflow:hidden;white-space:nowrap;font-size:16px;font-weight:700;letter-spacing:.01em;transition:max-width .25s ease, margin .25s ease}
.fab.ext .fab-l{max-width:110px;margin-left:8px}
.fab{transition:opacity .2s ease, transform .2s ease}
@media (prefers-reduced-motion:reduce){.fab,.fab-l{transition:none}}
.sms-alt{margin:10px 0 0;text-align:center;font-size:var(--small);color:var(--muted)}
.sms-alt a{color:var(--fg);font-weight:600;text-decoration:underline;text-underline-offset:2px;white-space:nowrap;display:inline-block;padding:6px 0;margin:-6px 0}
.empty .sms-alt{margin-top:12px}
.fab.away{opacity:0;transform:scale(.8);pointer-events:none}

/* GuestPage Algarve logo: the brand's own lockup, small, at the very end of Home and Help */
.gp-foot{margin:48px 0 0;display:flex;justify-content:center}
.gp-logo{display:inline-flex;flex-direction:column;align-items:center;gap:4px;padding:10px 14px;text-decoration:none;line-height:1}
.gp-logo .wm{font-size:19px}
.gp-sub{font-size:9px;letter-spacing:.42em;margin-right:-.42em;text-transform:uppercase;color:var(--muted)}
.wm{font-family:Georgia, "Times New Roman", serif;white-space:nowrap;letter-spacing:0}
.wm-guest{color:var(--wm-guest);font-weight:400}
.wm-page{color:var(--wm-page);font-weight:700}

/* House manager */
/* Contact card: who, when, then the two ways to reach them */
.hostcard{background:var(--surface);border-radius:var(--radius);padding:16px}
.host{display:flex;align-items:center;gap:14px}
.avatar{width:56px;height:56px;flex:none;border-radius:999px;background:var(--brand);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
img.avatar{display:block;object-fit:cover;background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.host-n{font-weight:600}
.host-r{font-size:var(--small);color:var(--muted)}
.em-num{display:block;font-size:40px;line-height:1.05;font-weight:700;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.host-note{margin:14px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:16px;line-height:1.55}
.hostcard .btn.wa{margin-top:16px}
/* Requests that become a ready-written WhatsApp: pick a time, send */
.req{margin-top:12px}
.req-l{display:block;font-size:var(--small);color:var(--muted);margin-bottom:6px}
.req-row{display:flex;gap:10px;align-items:stretch}
.req-sel{flex:none;min-width:104px;font:inherit;font-size:16px;font-weight:600;color:var(--fg);background:var(--bg);border:1px solid var(--switch-off);border-radius:12px;padding:0 10px;min-height:48px}
.req-row .btn{flex:1;min-width:0;white-space:nowrap;font-size:16px;padding:12px 10px}
@media (max-width:359px){.req-row{flex-wrap:wrap}.req-sel,.req-row .btn{flex:1 1 100%}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border-radius:999px;padding:4px}
.seg-o{position:relative;display:block;cursor:pointer}
.seg-o input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.seg-o span{display:block;text-align:center;padding:10px 8px;border-radius:999px;font-size:var(--small);font-weight:600;color:var(--muted)}
.seg-o input:checked+span{background:var(--bg);color:var(--fg);box-shadow:0 1px 4px var(--shadow)}
.seg-o input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.fix-steps{margin-bottom:14px}
.issues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.issue{display:flex;align-items:center;gap:8px;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);text-decoration:none;font-size:var(--small);font-weight:600;line-height:1.3}
.issue svg{width:18px;height:18px;flex:none;color:var(--muted)}
@media (max-width:339px){.issues{grid-template-columns:1fr}}
.fix-send{margin-top:4px}
.req-bags{display:flex;gap:12px;align-items:flex-start;margin-top:12px;font-size:var(--small);cursor:pointer}
.req-bags b{font-weight:600}
.req-bags input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--brand)}
.viewseg{margin:16px 0 4px}
.seg-b{display:block;width:100%;text-align:center;padding:10px 8px;border:0;border-radius:999px;background:transparent;font-size:var(--small);font-weight:600;color:var(--muted);cursor:pointer}
.seg-b[aria-selected="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 4px var(--shadow)}
.seg-note{margin:10px 0 0;font-size:var(--small);color:var(--muted)}
.btn.ghost{background:var(--bg);color:var(--fg);border:1.5px solid var(--switch-off)}
.host-urgent{margin:10px 0 0;text-align:center;font-size:var(--small);color:var(--muted)}
.host-urgent a{color:var(--fg);font-weight:600;white-space:nowrap;display:inline-block;padding:6px 0;margin:-6px 0}
.note-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.note-head h2{margin:0}
.avatar.sm{width:44px;height:44px;font-size:18px}
.signoff{margin:36px 0 0;font-size:var(--h2);font-weight:600}
.signoff .sig-name{margin-top:8px;font-weight:600;color:var(--fg)}
.signoff span.pt{display:inline;font-size:inherit;font-weight:inherit;color:inherit}
.signoff span{display:block;font-size:var(--small);font-weight:400;color:var(--muted)}

/* Tips inside a category row */
.tip{padding:12px 0;border-top:1px solid var(--line)}
.tip:first-child{border-top:0;padding-top:2px}
.tip h3{font-size:var(--body);font-weight:600;margin:0 0 4px}
.tip p{margin:0 0 6px}
.tip a{font-size:var(--small);font-weight:600}


/* GuestPage tips: the library's own panel, so guests can tell it from the host's information */
.tips-block{background:var(--tip-bg);border-radius:var(--radius);padding:18px 16px 6px}
.tips-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.tips-head svg{width:30px;height:30px;color:var(--wm-page);flex:none}
.tips-head h2{margin:0}
.tips-by{font-size:13px;color:var(--muted);margin:2px 0 0}
.tips-by .wm{font-size:14px}
.r-k .wm{font-size:14px}
.tips-block .sub{margin:6px 0 10px}
.tips-block .rows{border-top-color:var(--tip-line)}
.tips-block details.row{border-bottom-color:var(--tip-line)}
.tips-block details.row:last-child{border-bottom:0}
.tips-block .tip{border-top-color:var(--tip-line)}

/* Region question, shown once to phones set to US or Canadian English */
.units-ask{background:var(--surface);border-radius:var(--radius);padding:14px 16px;margin-top:14px}
.ask-t{font-weight:600}
.ask-s{font-size:var(--small);color:var(--muted)}
.units-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.units-btns .units-yes{width:auto;padding:10px 18px;font-size:var(--small)}

/* North American lines: hidden for everyone else, so the guide stays European by default */
.na{display:none}
:root.na-on li.na, .na-open li.na{display:list-item}
:root.na-on p.na, .na-open p.na{display:block}
.na-tag{display:inline-block;font-size:12px;font-weight:600;line-height:1.5;color:var(--muted);border:1px solid var(--switch-off);border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:1px}
.row-body .bullets{margin:0}

/* Region sheet */
.opts{border:0;margin:6px 0 0;padding:0;display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);cursor:pointer}
.opt input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--brand)}
.opt:has(input:checked){border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.opt-t{font-weight:600}
.opt-s{font-size:var(--small);color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Checkout */
.bigtime{display:flex;align-items:baseline;gap:10px;margin:16px 0 0}
.bigtime b{font-size:46px;line-height:1;font-weight:700;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.bigtime span{color:var(--muted)}
.checklist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.checklist li{border-bottom:1px solid var(--line)}
.checklist label{display:flex;gap:14px;align-items:flex-start;padding:13px 0;cursor:pointer}
.checklist input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--brand);flex:none}
.checklist input:checked+span{color:var(--muted);text-decoration:line-through}

/* Bottom tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .col{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:12px;font-weight:500;cursor:pointer;min-width:0;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--brand);font-weight:700}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--sky)}

/* Search screen */
.sscreen{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px)}
.sbar{position:sticky;top:0;background:var(--bg);z-index:1;border-bottom:1px solid var(--line)}
.sbar .col{display:flex;align-items:center;gap:8px;padding-block:10px}
.search{flex:1;min-width:0;position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:14px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;font-family:inherit;font-size:max(16px,var(--body));color:var(--fg);background:var(--surface);border:1px solid transparent;border-radius:999px;padding:11px 14px 11px 40px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.tbtn{font-size:var(--small);font-weight:600;background:transparent;border:0;padding:10px 6px;cursor:pointer;white-space:nowrap}
.sres .col{padding-block:12px 48px}
.slabel{font-size:var(--small);color:var(--muted);margin:6px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:var(--small);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.result{display:block;width:100%;text-align:left;font-size:var(--body);background:none;border:0;border-bottom:1px solid var(--line);padding:13px 0;cursor:pointer}
.r-k{font-size:13px;color:var(--muted);margin-bottom:1px}
.r-t{font-weight:600}
.r-s{font-size:var(--small);color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
mark{background:var(--mark);color:var(--fg);border-radius:3px;padding:0 1px}
.empty .btn{margin-top:14px}

/* Help sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:20px 20px 0 0;max-height:88%;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 -8px 30px var(--shadow);padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.sheet-head{position:sticky;top:0;z-index:1;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:14px 6px}
.sheet-title{font-size:var(--h1);font-weight:700;letter-spacing:-0.02em}
.sheet .block{margin-top:26px}
.sheet .block:first-of-type{margin-top:10px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;font-size:var(--body);font-weight:600;color:var(--btn-fg);background:var(--btn-bg);border:0;border-radius:999px;padding:14px 18px;text-decoration:none;cursor:pointer}
.btn svg{width:20px;height:20px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

.row,.place,.ess,.block,.essentials,.bigtime,.tip{scroll-margin-top:calc(var(--bar-h) + env(safe-area-inset-top,0px) + 14px)}
#panel-house :is(.row,.place,.block,.tip), #panel-explore :is(.row,.place,.block,.tip){scroll-margin-top:calc(var(--bar-h) + env(safe-area-inset-top,0px) + 66px)}
/* Section shortcuts: one tap instead of scrolling past five screens */
.jumpbar{position:sticky;top:calc(var(--bar-h) + env(safe-area-inset-top,0px));z-index:5;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;background:var(--bg);margin:12px -16px 0;padding:8px 16px;border-bottom:1px solid var(--line)}
.jumpbar::-webkit-scrollbar{display:none}
.viewseg + .view .jumpbar, .view > .jumpbar{margin-top:8px}
.jump[aria-current="true"]{background:var(--brand);color:var(--bg)}
.jump{flex:none;min-height:36px;font-size:14px;font-weight:600;color:var(--fg);background:var(--surface);border:0;border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.sheet .row,.sheet .place,.sheet .block,.sheet .tip{scroll-margin-top:84px}
.flash{animation:flash 1.8s ease-out 1}
@keyframes flash{from{background:var(--mark)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}.chev,.appbar,.appbar-title,.ibtn{transition:none}}
</style>

<script>
/* =====================================================================
   PER-CLIENT SETTINGS. A client page changes these two lines only:
   the Google Sheet ID, and the folder name (slug) in the image path.
   ===================================================================== */
const SHEET_URL = "https://docs.google.com/spreadsheets/d/REPLACE-SHEET-ID/export?format=csv";
const IMG = "/clients/REPLACE-SLUG/assets/images/";
// Demos embed their data here. Client pages leave it null and read the sheet.
const EMBED = null;
// Per-page storage scope, so two guides on the same site never share ticks or tabs.
const SCOPE = (SHEET_URL.match(/\/d\/([^/]{6,})/) || [, "demo"])[1].slice(0, 12);

function boot(S){
// Items are separated by " | " so an item can contain a comma ("Olive oil, salt and pepper").
const INCLUDED = String(S.included || "").split(/\s*\|\s*/).filter(Boolean);
// Shared Algarve tips. A sheet can hide some with tips_hide ("pool, bbq" as tip ids, or "all").
const TIPS_HIDE = new Set(String(S.tips_hide || "").toLowerCase().split(/[,|]\s*/).map(x => x.trim()).filter(Boolean));
const TIPS = TIPS_HIDE.has("all") ? [] : [{"id": "sunscreen-linen", "topic": "Sunscreen and the linen", "keywords": "sunscreen suncream protetor solar sheets towels stains linen oil after-sun", "answer": "Sunscreen and after-sun leave yellow stains on white sheets and towels that do not wash out. Apply cream 20 minutes before you go out so it soaks into the skin, shower before bed, and use the beach towels, never the bath towels, on sunbeds and sofas. A quick rinse at the beach shower helps too.", "category": "Sun & beach", "link": ""}, {"id": "uv-hours", "topic": "When the sun is strongest", "keywords": "uv sun hours heat midday shade burn hat sol calor", "answer": "Between May and September the UV index in the Algarve is very high from about 11h00 to 17h00. Plan beach time for early morning or late afternoon, use factor 30 or higher, reapply after swimming, and keep children in the shade at midday. Even on cloudy days you can burn.", "category": "Sun & beach", "link": ""}, {"id": "heat", "topic": "Coping with the heat", "keywords": "heat heatwave heatstroke dehydration hot calor water drink", "answer": "Summer afternoons regularly pass 30 degrees. Drink water before you feel thirsty, close the shutters on the sunny side during the day and open the windows in the evening to cool the house. Signs of heat exhaustion are headache, dizziness and nausea: rest in the shade, drink and cool the skin. Call 112 if someone becomes confused or stops sweating.", "category": "Sun & beach", "link": ""}, {"id": "beach-flags", "topic": "Beach flags and lifeguards", "keywords": "flag flags lifeguard red yellow green bandeira nadador salvador swimming safe", "answer": "Guarded beaches fly a flag: green means safe to swim, yellow means paddle only, red means stay out of the water. A chequered flag means the beach is temporarily unguarded. Lifeguards are on duty roughly from June to September, usually 10h00 to 19h00. Outside those months and hours you swim at your own risk.", "category": "Sun & beach", "link": ""}, {"id": "sea-temperature", "topic": "Sea temperature and waves", "keywords": "sea water cold temperature waves currents mar frio ondas", "answer": "The Atlantic here is cooler than the Mediterranean, about 18 to 22 degrees in summer. The south coast beaches near Lagos are calm and sheltered; the west coast beaches have big waves and strong currents and are for experienced swimmers and surfers only. Never swim near rocks or in the caves.", "category": "Sun & beach", "link": ""}, {"id": "cliffs", "topic": "Cliff safety", "keywords": "cliffs rocks falésia rockfall edge photo danger", "answer": "The golden cliffs are beautiful and fragile. Rockfalls happen every year, so stay behind the signs on the top paths and do not sit or lie directly under the cliff face on the beach. Keep well back from the edge for photos, the ground can give way.", "category": "Sun & beach", "link": ""}, {"id": "jellyfish", "topic": "Jellyfish and Portuguese man o' war", "keywords": "jellyfish sting medusa caravela man o war", "answer": "Jellyfish are occasional, usually after a few days of onshore wind. Lifeguards raise a warning if they are around. If you are stung, rinse with sea water, not fresh water, remove any tentacle pieces with a card, and ask the lifeguard for help. A Portuguese man o' war, a blue balloon-like creature, is rare but serious: do not touch it, even on the sand.", "category": "Sun & beach", "link": ""}, {"id": "tides", "topic": "Tides and the caves", "keywords": "tide tides low high caves grottos maré", "answer": "Tides here are big. Some coves, caves and rock passages that you can walk through at low tide are cut off two hours later. Check the tide times before you explore on foot, and never enter a sea cave from the beach.", "category": "Sun & beach", "link": ""}, {"id": "sand-house", "topic": "Keeping sand out of the house", "keywords": "sand sandy feet shower rinse areia", "answer": "Sand in the beds is the most common complaint from the next guests. Use the beach shower or the outdoor tap to rinse feet before you come in, shake towels outside, and keep beach bags by the door rather than in the bedrooms.", "category": "Sun & beach", "link": ""}, {"id": "dogs-beach", "topic": "Dogs on the beach", "keywords": "dog dogs pets beach cão cães allowed", "answer": "Dogs are not allowed on guarded beaches during the bathing season, roughly June to September. A few beaches are designated dog friendly; ask us for the nearest one. Outside the season, early morning walks on the sand are fine.", "category": "Sun & beach", "link": ""}, {"id": "nortada", "topic": "The afternoon wind", "keywords": "wind windy nortada vento afternoon beach umbrella", "answer": "On many summer afternoons a steady northerly wind picks up, especially on the west coast. Beaches tucked under the cliffs on the south coast stay sheltered. If the parasol is fighting you, that is your cue to move to a sheltered cove or head to the pool.", "category": "Sun & beach", "link": ""}, {"id": "mosquitoes", "topic": "Mosquitoes", "keywords": "mosquito mosquitoes bites repellent net mosquitos picadas", "answer": "Mosquitoes are around from spring to autumn, worst at dusk near water and gardens. Keep the mosquito nets closed at night, use the plug-in repellent if the property provides one, and wear long sleeves in the evening. Pharmacies sell repellent and after-bite cream.", "category": "Pests & wildlife", "link": ""}, {"id": "cockroaches", "topic": "Cockroaches", "keywords": "cockroach cockroaches baratas roaches insects drains kitchen", "answer": "Cockroaches are part of life in warm climates and are not a sign of a dirty house. They come up through drains and in through gaps on hot nights. Keep food in sealed containers, do not leave dirty dishes overnight, close the bins, and run water in unused drains. If you see more than the odd one, tell us and we will treat the house.", "category": "Pests & wildlife", "link": ""}, {"id": "ants", "topic": "Ants", "keywords": "ants ant formigas trail kitchen sugar", "answer": "Ants follow sugar and crumbs. Wipe surfaces after meals, keep fruit in the fridge, and rinse sticky bottles. A line of ants usually disappears within a day once the food source is gone. Tell us if they keep coming.", "category": "Pests & wildlife", "link": ""}, {"id": "geckos", "topic": "Geckos", "keywords": "gecko geckos lizard lagartixa osga wall ceiling", "answer": "The small pale lizards you see on walls at night are geckos. They are harmless, they eat mosquitoes, and in Portugal they are considered good luck. Please leave them be.", "category": "Pests & wildlife", "link": ""}, {"id": "wasps", "topic": "Wasps and bees", "keywords": "wasp wasps bee bees vespas abelhas sting", "answer": "Wasps show up around food and sweet drinks in late summer. Keep drinks covered outside and clear plates promptly. If someone is stung and has trouble breathing, call 112. Pharmacies sell antihistamine cream.", "category": "Pests & wildlife", "link": ""}, {"id": "processionary", "topic": "Pine processionary caterpillars", "keywords": "caterpillar caterpillars processionary pine dog rash lagarta", "answer": "In late winter and spring you may see lines of hairy caterpillars under pine trees. Do not touch them and keep dogs and children away: the hairs cause a painful rash and are dangerous for dogs. Just walk around.", "category": "Pests & wildlife", "link": ""}, {"id": "snakes", "topic": "Snakes and scorpions", "keywords": "snake snakes scorpion cobra escorpião", "answer": "Snakes are rarely seen and almost all are harmless. Scorpions exist but are small and their sting is like a bee's. Shake out shoes left outside overnight and you will never meet either.", "category": "Pests & wildlife", "link": ""}, {"id": "humidity", "topic": "Damp and mould", "keywords": "humidity damp mould mold humidade bolor ventilate winter smell", "answer": "Houses near the sea get damp, especially in winter. Open windows for 10 minutes a day even when it is cold, run the bathroom extractor after showers, and do not dry laundry indoors with everything closed. A dehumidifier, if provided, does wonders overnight.", "category": "Home & comfort", "link": ""}, {"id": "shutters-cool", "topic": "Keeping cool, keeping warm", "keywords": "cool cooling shutters hot house ac aircon fresco central air ac aircon thermostat heating winter cold", "answer": "The old Algarve trick: close the shutters and windows on the sunny side in the morning, open everything in the evening. | Air conditioning, where a house has it, is a wall unit in each room and works best with doors and windows closed, at 24 degrees rather than 18. Please switch it off when you go out; it is the biggest cost in the house. | In winter, houses built for summer can feel cold. Heating is room by room.", "category": "Home & comfort", "link": ""}, {"id": "power-cut", "topic": "Power cuts", "keywords": "power cut electricity fuse trip luz falta blackout", "answer": "Short power cuts happen, especially during storms. If only your house is out, check the fuse box: a tripped switch will be down, push it up. Running the oven, kettle and air conditioning at once can trip the main switch. If the whole street is dark, it will come back, usually within the hour.", "category": "Home & comfort", "link": ""}, {"id": "gas-bottle", "topic": "Gas bottles", "keywords": "gas bottle botija gás hob cooker empty smell", "answer": "Many Algarve homes cook on bottled gas. If the flame dies, the bottle is empty: close the valve, swap to the spare if there is one, and tell us. If you ever smell gas, open the windows, do not use switches, close the bottle valve and call us.", "category": "Home & comfort", "link": ""}, {"id": "hot-water-solar", "topic": "Solar hot water", "keywords": "hot water solar panel shower cold morning água quente", "answer": "Many houses heat water with solar panels. It means plenty of hot water after a sunny day and less on a cloudy morning or after several showers in a row. Space showers out, and on grey days the electric backup, if there is one, takes about an hour.", "category": "Home & comfort", "link": ""}, {"id": "laundry-drying", "topic": "Drying laundry", "keywords": "laundry drying rack line dry clothes roupa secar dryer washer washing machine cycle", "answer": "In the Algarve sun, laundry dries outside in a couple of hours. Use the rack or line rather than radiators or the sofa, and bring things in before evening, when the damp comes back. | Tumble dryers are rare here. Washing machine cycles take 1 to 3 hours, and 40 degrees is a normal wash.", "category": "Home & comfort", "link": ""}, {"id": "plumbing-paper", "topic": "Toilets and paper", "keywords": "toilet paper bin flush blocked sanita papel entupido", "answer": "Older houses have narrow pipes or septic tanks. If there is a bin next to the toilet with a sign, put paper in the bin. Never flush wipes, cotton buds or sanitary products anywhere. If the toilet blocks, tell us straight away rather than trying to force it.", "category": "Home & comfort", "link": ""}, {"id": "limescale", "topic": "Hard water and limescale", "keywords": "limescale hard water kettle calcário white marks", "answer": "Tap water here is hard, so you will see white marks on the kettle and shower screen. It is harmless. A splash of vinegar clears the kettle. Tap water is safe to drink; bottled water is cheap if you prefer the taste.", "category": "Home & comfort", "link": ""}, {"id": "noise", "topic": "Noise and neighbours", "keywords": "noise quiet hours neighbours party music barulho ruído", "answer": "Portuguese law sets quiet hours from 23h00 to 07h00, and neighbours here do call the police about noise. Keep music and voices down on terraces after 23h00, especially in apartments. Church bells and early bin lorries are part of the charm.", "category": "Home & comfort", "link": ""}, {"id": "recycling", "topic": "Recycling", "keywords": "recycling bins rubbish glass plastic paper lixo reciclagem ecoponto", "answer": "Street bins come in colours: yellow for plastic and metal packaging, blue for paper and card, green for glass, and a grey or brown bin for everything else. Bottles go in unbagged. Bins are emptied at night, so take rubbish out in the evening rather than leaving it by the door.", "category": "Home & comfort", "link": ""}, {"id": "water-saving", "topic": "Saving water", "keywords": "water saving drought shortage seca água poupar", "answer": "The Algarve has had several years of drought and water restrictions are real. Short showers, taps off while brushing teeth, and no hosing of terraces make a difference. Pools are topped up by the maintenance team, not by guests.", "category": "Home & comfort", "link": ""}, {"id": "plugs", "topic": "Plugs and voltage", "keywords": "plug socket adapter voltage 230 tomada adaptador uk outlet outlets adapter converter 110 120 volts hair dryer straightener curling iron charger", "answer": "Portugal uses round two-pin plugs (types F and C) at 230 volts. UK visitors need an adapter. | NA: Your devices run on 120 volts. Chargers marked 100 to 240V only need an adapter, but hair dryers, straighteners and curling irons will burn out, so use the hairdryer in the house. | Adapters are sold at supermarkets and Chinese bazaars.", "category": "Home & comfort", "link": ""}, {"id": "fire-risk", "topic": "Fire risk in summer", "keywords": "fire wildfire bbq ban smoke incêndio fogo", "answer": "From June to October the countryside is tinder dry. BBQs are only allowed in proper fixed grills, never on open ground, and on days of extreme risk even those are banned. No fireworks, no cigarette ends out of car windows. If you see smoke in the hills, call 112.", "category": "Home & comfort", "link": ""}, {"id": "emergency", "topic": "Emergency numbers", "keywords": "emergency 112 ambulance police fire emergência polícia bombeiros 911 ambulance police fire", "answer": "112 is the single number for ambulance, police and fire anywhere in Portugal, free from any phone, and operators speak English. | NA: Remember: 112, not 911. | For health advice that is not an emergency, SNS 24 on 808 24 24 24 has English speaking nurses around the clock.", "category": "Health & safety", "link": ""}, {"id": "pharmacy", "topic": "Pharmacies", "keywords": "pharmacy chemist farmácia medicine prescription duty night tylenol advil motrin acetaminophen paracetamol ibuprofen drugstore", "answer": "Pharmacies, marked with a green cross, are excellent, and pharmacists can advise and sell many medicines without a prescription. | Brand names differ from home, so ask by the active ingredient. | NA: Tylenol is paracetamol here (Ben-u-ron) and Advil is ibuprofen. | Hours are usually 9h00 to 19h00 with a lunch break. Every town has a duty pharmacy open overnight; the rota is posted on every pharmacy door.", "category": "Health & safety", "link": ""}, {"id": "doctor", "topic": "Seeing a doctor", "keywords": "doctor clinic hospital ehic ghic insurance médico urgências insurance medicare travel insurance prescription", "answer": "For minor problems, a private clinic sees you the same day for a fixed fee. For emergencies go to the hospital urgências or call 112. | EU visitors with an EHIC and UK visitors with a GHIC can use the public health centres. Bring your card and passport. | Bring prescription medicines in their original packaging. | NA: Your health insurance and Medicare usually won't pay here, so expect to pay and claim it back. Travel insurance is worth having.", "category": "Health & safety", "link": ""}, {"id": "valuables", "topic": "Theft and valuables", "keywords": "theft stolen valuables safe car beach roubo", "answer": "The Algarve is safe, but opportunist theft from beaches and parked cars happens. Do not leave bags unattended on the sand, never leave anything visible in a car, and use the safe if the house has one. For any theft, report to the police (PSP or GNR) to get the paper your insurance needs.", "category": "Health & safety", "link": ""}, {"id": "lost-passport", "topic": "Lost passport", "keywords": "passport lost stolen embassy consulate passaporte embassy consulate us canada american canadian stolen", "answer": "Report the loss to the local police and get the report number, then contact your embassy or consulate in Lisbon. The British Consulate in Portimão also helps UK citizens. | NA: US Embassy: +351 21 770 2122, after hours +351 21 727 3300. Embassy of Canada: +351 21 316 4600. | An emergency travel document can usually be issued within a few days. Keep a photo of your passport on your phone from day one.", "category": "Health & safety", "link": ""}, {"id": "earthquake", "topic": "Earthquakes", "keywords": "earthquake tremor sismo terramoto", "answer": "The Algarve is a mild seismic zone and small tremors are occasionally felt. If one happens, stay indoors away from windows, under a table or in a doorway, and wait until it stops. That is all that is normally needed.", "category": "Health & safety", "link": ""}, {"id": "cash-cards", "topic": "Cash and cards", "keywords": "cash card pay contactless multibanco atm dinheiro cartão dollars usd pounds conversion exchange rate tap pay apple pay tax", "answer": "Cards and tap to pay work almost everywhere, but small cafés, markets and some beach bars are cash only. | Use Multibanco ATMs, the ones set into bank walls. Stand-alone machines in tourist streets charge fees. | If a card machine or ATM offers to charge you in your home currency, choose euros. The conversion they offer uses a worse rate. | Prices include tax, so the price on the menu or shelf is what you pay.", "category": "Money & practical", "link": ""}, {"id": "tipping", "topic": "Tipping", "keywords": "tip tipping gorjeta service restaurant taxi gratuity percent server tip screen", "answer": "Tipping is appreciated, not expected. | Restaurants: round up, or 5 to 10 percent for good service. Cafés: a few coins. Taxis and Uber: round up, or tip in the app. | NA: There is no 18 to 20 percent here, and skipping the tip screen on a card machine is completely normal.", "category": "Money & practical", "link": ""}, {"id": "couvert", "topic": "The couvert in restaurants", "keywords": "couvert bread olives starter charge restaurant bill free bread olives butter", "answer": "Bread, olives and pâté arrive at your table before you order. They are not free: this is the couvert, charged per item or per person. | If you don't want it, say \"Não, obrigado\" and send it back. That is completely normal. Touch it and you pay for it.", "category": "Money & practical", "link": ""}, {"id": "shop-hours", "topic": "Shop and restaurant hours", "keywords": "hours open closed sunday lunch siesta horário sunday bags receipt contribuinte nif tax number grocery store", "answer": "Small shops open around 9h00 to 13h00 and 15h00 to 19h00, and many close on Sunday. Supermarkets stay open through lunch and on Sundays until early evening. | Restaurants serve lunch 12h00 to 15h00 and dinner from 19h00; kitchens often close by 22h00 outside the summer. | Shopping bags cost a few cents, so bring one. | At the checkout you may hear \"Contribuinte?\" That is the Portuguese tax number for the receipt. Just say no.", "category": "Money & practical", "link": ""}, {"id": "public-holidays", "topic": "Public holidays", "keywords": "holiday holidays bank holiday closed feriado", "answer": "On public holidays supermarkets may close early and small shops close entirely. Restaurants and beach bars stay open. Big ones: 25 April, 1 May, 10 June, 15 August, 5 October, 1 November, 1 and 8 December, plus Easter and Corpus Christi.", "category": "Money & practical", "link": ""}, {"id": "sim-roaming", "topic": "Mobile phones and SIM cards", "keywords": "sim phone roaming data mobile internet cartão telemóvel cell cellphone esim whatsapp calling +351", "answer": "EU phones roam at home rates. UK visitors should check their plan; some charge daily. | NA: Check your carrier's international plan or buy an eSIM before you fly. | Prepaid SIMs from MEO, NOS or Vodafone are sold at supermarkets and phone shops with a passport, and data is cheap. | Locals, restaurants and your host use WhatsApp for almost everything. Portuguese mobiles have 9 digits starting with 9, after +351.", "category": "Money & practical", "link": ""}, {"id": "post", "topic": "Post and parcels", "keywords": "post office stamps parcel postcard ctt correio", "answer": "CTT is the post office; stamps are also sold in shops with the CTT sign. Postcards to Europe take about a week. Do not have parcels delivered to a holiday rental unless you have agreed it with us; couriers need someone in.", "category": "Money & practical", "link": ""}, {"id": "language", "topic": "A few words of Portuguese", "keywords": "language portuguese words please thank you obrigado bom dia spanish gracias manners etiquette greeting rude service", "answer": "English is widely spoken, but a little Portuguese goes a long way: bom dia (good morning), boa tarde (good afternoon), boa noite (good evening), por favor (please), obrigado if you are a man or obrigada if you are a woman (thank you), a conta (the bill). | It is Portuguese, not Spanish: gracias does not land well. | Say bom dia or boa tarde when you walk into a shop. Service is polite but not chatty, and nobody is being rude.", "category": "Money & practical", "link": ""}, {"id": "tolls", "topic": "Motorway tolls", "keywords": "toll tolls a22 motorway portagem rental car transponder a2 a22 via verde transponder highway freeway", "answer": "The A22 motorway along the Algarve has been toll free since 1 January 2025, so you do not need a transponder for it. | The A2 motorway to Lisbon has toll booths that take cash and cards. Some motorways in other regions still use electronic tolls only; for a long drive, ask your rental company for a Via Verde device.", "category": "Getting around", "link": ""}, {"id": "driving", "topic": "Driving in Portugal", "keywords": "driving speed limit roundabout alcohol seatbelt conduzir right on red manual automatic stick shift license licence permit idp aaa caa alcohol phone car seat speed camera fine mph", "answer": "Drive on the right. Speed limits are 50 km/h in towns, 90 km/h on ordinary roads and 120 km/h on motorways, and speed cameras are common. Fines on rental cars reach you through the rental company, plus a fee. | Roundabouts: traffic already on the roundabout has priority, and the inside lane is for going round, so signal and move out early. | The drink-drive limit is low, 0.5 grams per litre, and police do check. | Holding a phone while driving is illegal, even at a red light. Children under 12 need a car seat. | Most rental cars are manual, so book an automatic early. | NA: No right turn on red. The alcohol limit (0.05%) is lower than in most of the US. Your licence is valid for visits of up to 185 days, and an International Driving Permit (from AAA or CAA) is recommended.", "category": "Getting around", "link": ""}, {"id": "parking", "topic": "Parking", "keywords": "parking park blue lines meter ticket fine estacionar", "answer": "White lines are free, blue lines are paid: buy a ticket at the meter (coins or app) and put it on the dashboard. Paid hours are usually 9h00 to 19h00 on weekdays, free on Sundays, but read the sign. Yellow lines mean no parking. Beaches have free parking outside the summer and paid or full in August; go early.", "category": "Getting around", "link": ""}, {"id": "fuel", "topic": "Fuel", "keywords": "petrol diesel fuel gasolina gasóleo station gas gasoline gas station pump unleaded gallon litre liter", "answer": "Gasóleo is diesel, not gasoline. Gasolina 95 (sem chumbo 95) is regular unleaded. Check the sticker inside the fuel cap before you fill up. | At many stations you pay inside: tell the cashier your pump number. Most pumps take cards; some rural ones are cash only. | Supermarket fuel stations are the cheapest. | NA: Fuel is sold by the litre, about 3.8 litres to a US gallon.", "category": "Getting around", "link": ""}, {"id": "taxis-apps", "topic": "Taxis, Uber and Bolt", "keywords": "taxi uber bolt ride app driver táxi", "answer": "Uber and Bolt both work in the Algarve and are usually cheaper than taxis, though waits can be long in small towns and late at night. Taxis are cream coloured and metered; from the airport there is a fixed rate list. For airport transfers, a pre-booked driver costs about the same and waits for you.", "category": "Getting around", "link": ""}, {"id": "public-transport", "topic": "Trains and buses", "keywords": "train bus comboio autocarro timetable cp vamus", "answer": "The regional train runs along the coast from Lagos to Faro and on to Vila Real, slow but scenic and cheap; tickets at the station or on the CP app. Vamus buses connect towns and beaches. Neither runs late at night. For Lisbon, the Rede Expressos coach is comfortable and takes about four hours.", "category": "Getting around", "link": ""}, {"id": "ev-charging", "topic": "Charging an electric car", "keywords": "ev electric charging charger mobi.e carregar", "answer": "Public chargers run on the Mobi.E network. You need a card or app from any provider (Miio, Mobi.E, EDP) before you can charge; you cannot just tap a bank card at most of them. Set it up before you need it. Many supermarkets have chargers in the car park.", "category": "Getting around", "link": ""}, {"id": "coffee", "topic": "Ordering coffee", "keywords": "coffee espresso bica galão meia de leite café", "answer": "Um café is a small espresso. Meia de leite is half coffee, half milk in a cup; galão is the same in a tall glass. Abatanado is a longer black coffee. Coffee at the counter is cheaper than at a table, and a pastel de nata alongside is the law.", "category": "Food & drink", "link": ""}, {"id": "what-to-eat", "topic": "What to eat in the Algarve", "keywords": "food local dish cataplana sardines grilled fish seafood comida", "answer": "Grilled fish is the thing: sardines in summer, dourada and robalo all year, sold by weight. Cataplana is a seafood stew cooked in a copper pan, made for two. Try amêijoas (clams), polvo (octopus), and Dom Rodrigo, the local egg and almond sweet. Ask for the daily fish rather than the tourist menu.", "category": "Food & drink", "link": ""}, {"id": "markets", "topic": "Markets", "keywords": "market mercado saturday fish fruit vegetables", "answer": "Every town has a covered municipal market, open mornings except Sunday, for fish landed that morning, fruit, cheese and bread. Saturday is the big day. Gypsy markets with clothes and household goods rotate around the towns once a month.", "category": "Food & drink", "link": ""}, {"id": "wine", "topic": "Local wine and drinks", "keywords": "wine beer medronho vinho cerveja port", "answer": "Algarve wines from Lagos, Lagoa and Tavira are getting good and cheap in supermarkets. Sagres and Super Bock are the beers. Medronho is the local firewater made from the strawberry tree, drunk after dinner, treat it with respect. Vinho verde, light and fizzy, is perfect at lunch.", "category": "Food & drink", "link": ""}, {"id": "golf", "topic": "Golf", "keywords": "golf course courses tee time clubs golfe", "answer": "The western Algarve has some of Europe's best courses, several within 20 minutes of Lagos: Palmares, Boavista, Espiche and Penina among them. Book tee times in advance in spring and autumn, the peak seasons. Most clubs hire out sets. Summer green fees are much cheaper.", "category": "Things to do", "link": ""}, {"id": "boat-trips", "topic": "Boat trips and the caves", "keywords": "boat trip caves grottos benagil dolphins kayak barco", "answer": "Boat and kayak trips to the sea caves leave from the marinas and beaches all along the coast. Mornings are calmer and less crowded. Dolphin watching trips find dolphins on most days. Book a day ahead in summer, and for Benagil cave go early or take a small boat rather than swimming in.", "category": "Things to do", "link": ""}, {"id": "hiking", "topic": "Walking and hiking", "keywords": "walk hike hiking trail path rota vicentina fishermen caminhada", "answer": "The clifftop paths are the best free thing here: the Seven Hanging Valleys near Carvoeiro and the Fishermen's Trail on the west coast. Go early, take water and a hat, and stay on the marked paths. The Ecovia cycle path runs the length of the coast.", "category": "Things to do", "link": ""}, {"id": "day-trips", "topic": "Day trips", "keywords": "day trip sagres silves monchique tavira seville excursion", "answer": "Sagres and Cape St Vincent for the end of the world, Silves for the castle, Monchique for the mountain and the views, Tavira for the prettiest town in the east. Seville is under three hours by car for a big day out. The west coast beaches at Carrapateira and Amado are another world.", "category": "Things to do", "link": ""}, {"id": "kids", "topic": "With children", "keywords": "kids children family zoo waterpark playground crianças", "answer": "Beaches with calm water and lifeguards are the easy win. Beyond that: Lagos Zoo, the water parks at Lagoa and Guia, Zoomarine, boat trips, and the Krazy World animal park. Most restaurants welcome children at any hour and have high chairs. Pharmacies sell all the baby supplies you might have forgotten.", "category": "Things to do", "link": ""}, {"id": "surf", "topic": "Surfing and lessons", "keywords": "surf surfing lessons board bodyboard wetsuit", "answer": "The west coast is one of Europe's best surf areas and schools run daily lessons for complete beginners, transport and wetsuit included. Even in summer you will want the wetsuit. The south coast near Lagos only has waves in winter.", "category": "Things to do", "link": ""}, {"id": "sunset", "topic": "Where to watch the sunset", "keywords": "sunset sunrise pôr do sol view spot", "answer": "Ponta da Piedade and the cliffs west of Lagos face the sunset; Cape St Vincent at Sagres is the classic, with a crowd. For a quiet one, any west-facing beach or the fort at Praia da Luz. Bring a layer, it cools fast once the sun is down.", "category": "Things to do", "link": ""}, {"id": "nudism", "topic": "Naturist beaches", "keywords": "nudist naturist nude topless praia naturista", "answer": "Topless is normal on most beaches. Full naturism is allowed only on the officially designated naturist beaches, a few along the coast; ask us for the nearest. Elsewhere it can get you a fine.", "category": "Things to do", "link": ""}, {"id": "drones", "topic": "Drones and photography", "keywords": "drone drones fly photo cliffs", "answer": "Drones are restricted near beaches with people, over towns and in the protected coastal parks, and you need to register on the AAN portal before flying. Fines are steep. Phone photos from the cliff paths are spectacular enough.", "category": "Things to do", "link": ""}, {"id": "time-dates", "topic": "Time and dates", "keywords": "time clock 24 hour am pm date dates time zone difference new york toronto los angeles vancouver daylight saving", "answer": "Times use the 24-hour clock: 16h00 is 4 PM, 21h00 is 9 PM. | Dates are day first: 03/04 is 3 April. | Mainland Portugal keeps the same time as London. | NA: Portugal is 5 hours ahead of New York and Toronto, 8 ahead of Los Angeles and Vancouver. Clocks change on the last Sunday of March and of October, a few weeks apart from North America. | NA: Choose your region with the globe at the top of the guide to see 4 PM instead of 16h00.", "category": "Money & practical", "link": ""}, {"id": "units", "topic": "Celsius and metric", "keywords": "fahrenheit celsius temperature miles mph kilometers km liters gallons grams pounds lb cups metric", "answer": "Temperatures are in Celsius, distances in kilometres, and speed limits in km/h. 1 km is about 0.6 miles, and 120 km/h is about 75 mph. | NA: Quick Celsius rule: double it and add 30. 20 °C is 68 °F, 25 °C is 77 °F, 30 °C is 86 °F, 35 °C is 95 °F. | NA: Oven: 180 °C for 350 °F, 200 °C for 400 °F. 1 kg is 2.2 lb, and a US cup is about 240 ml. | NA: Choose United States with the globe at the top to see miles and °F across the guide.", "category": "Money & practical", "link": ""}, {"id": "doors-floors", "topic": "Doors and floors", "keywords": "door doors lock locked out keys key knob floor floors ground first second elevator lift", "answer": "Many front doors have a fixed knob outside, not a handle. If the door shuts behind you without the key, you are locked out, so take the keys every time you step out. | Floors count from zero: the ground floor is 0 or R/C, and the 1st floor is one flight up. | NA: Our 1st floor is your 2nd floor.", "category": "Home & comfort", "link": ""}, {"id": "bathroom", "topic": "Bathroom basics", "keywords": "bathroom restroom bidet light switch socket outlet", "answer": "The second low bowl next to the toilet is a bidet, for washing. | Bathroom light switches are often outside the door, and bathrooms rarely have normal sockets.", "category": "Home & comfort", "link": ""}, {"id": "kitchen", "topic": "Hob, oven and ice", "keywords": "stove stovetop cooktop hob induction oven pans ice ice maker fridge", "answer": "Many hobs (stovetops) are induction and only heat magnetic pans, so use the pans in the house. | Ovens are in Celsius. | NA: 180 °C is about 350 °F. | Fridges are smaller and rarely make ice. Bags of ice (gelo) are sold at supermarkets and petrol stations.", "category": "Home & comfort", "link": ""}, {"id": "walking", "topic": "Walking and crossings", "keywords": "walk walking pavement sidewalk crosswalk crossing pedestrian cobblestones calçada shoes flip flops", "answer": "Cars stop for you at zebra crossings, so step out clearly when it is safe. | Pavements are polished stone cobbles (calçada): slippery when wet and hard on flip-flops, so wear proper shoes in town.", "category": "Getting around", "link": ""}, {"id": "eating-out", "topic": "Eating out", "keywords": "restaurant restaurants dinner lunch bill check waiter server service slow", "answer": "Lunch runs about 12h30 to 15h00 and dinner starts around 19h30, with locals eating later. Many kitchens close in between, so mid-afternoon means snacks rather than meals. | Nobody rushes you. Servers check on you less than you may be used to, and the bill only comes when you ask: \"A conta, por favor.\" | The card machine comes to your table.", "category": "Food & drink", "link": ""}, {"id": "water-refills", "topic": "Water, refills and ice", "keywords": "water tap water free bottled sparkling still refill refills soda ice", "answer": "Ask for tap water, água da torneira: restaurants must serve it free if you ask. | Bottled water is com gás (sparkling) or sem gás (still). | There are no free refills on soft drinks, and drinks come with little or no ice.", "category": "Food & drink", "link": ""}].filter(x => !TIPS_HIDE.has(String(x.id).toLowerCase()));

function parsePlaces(str){
  return String(str || "").split(" | ").filter(x => x.trim()).map(p => {
    const parts = p.split(" — ").map(x => x.trim());
    let url = null;
    if (parts.length > 1 && /^https?:\/\//.test(parts[parts.length-1])) url = parts.pop();
    return {name: parts[0], desc: cap(parts.slice(1).join(", ")), url};
  });
}

}

    const body = list.map(x => `<div class="tip" id="tip-${esc(x.id)}"${NOUNITS.has(x.id) ? " data-nounits" : ""}><h3>${esc(x.topic)}</h3>${answerHTML(x.answer)}${/^https?:\/\//.test(x.link || "") ? `<a href="${esc(x.link)}" target="_blank" rel="noopener">More information</a>` : ""}</div>`).join("");
    return `<details class="row"><summary><span class="row-title">${esc(label)}</span><span class="row-preview">${esc(list.map(x => x.topic).join(" · "))}</span>${ICON.chev}</summary><div class="row-body">${body}</div></details>`;
  }).join("");
  const n = cats.reduce((a, c) => a + TIPS.filter(x => x.category === c).length, 0);
  return `<section class="block tips-block"><div class="tips-head">${TIPS_ICON}<div><h2>Local know-how</h2><p class="tips-by">from ${WM}, written here in the Algarve</p></div></div><p class="sub">If anything here differs from what I've told you about the ${PLACE}, go with the ${PLACE}.</p><div class="rows">${rowsHTML}</div></section>`;
}
// Free text with " | " between paragraphs; lines starting "- " become a bulleted list.
function noteHTML(text){
  const parts = String(text || "").split(/\s+\|\s+/).map(x => x.trim()).filter(Boolean);
  let html = "", list = [];
  const flush = () => { if (list.length){ html += `<ul class="bullets">${list.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`; list = []; } };
  parts.forEach(p => { if (/^[-•]\s+/.test(p)) list.push(p.replace(/^[-•]\s+/, "")); else { flush(); html += `<p>${esc(p)}</p>`; } });
  flush();
  return html;
}
// Phone numbers inside a line become tap-to-call links.
// Nine-digit Portuguese numbers get +351, so they also dial from a foreign SIM.
// Also reads 00351 282 770 790 and (0044) 7970 299 412.
// Links 112-style short numbers and full numbers (nine digits or more), nothing in between.
function telify(t){ return esc(t).replace(/(?:\(\+?\d{2,5}\)\s?|\+)?\d[\d ]{1,16}\d/g, m => { let d = m.replace(/[^\d+]/g, ""); if (d.charAt(0) !== "+" && d.slice(0, 2) === "00") d = "+" + d.slice(2); else if (/^\d{9}$/.test(d)) d = "+351" + d; const n = d.replace("+", "").length; return n === 3 || n >= 9 ? `<a href="tel:${d}">${m}</a>` : m; }); }
function copyBtn(value, selId){ return `<button class="copy" type="button" data-copy="${esc(value)}" data-sel="${selId}">Copy</button>`; }

      `Restart the router${S.router_spot ? `, ${S.router_spot}` : ""}: unplug it, count to ten, plug it back in.`,
      "Give it two minutes for the lights to settle, then connect again."],

    {id:"fix-keysafe", title:"Keysafe won't open", show: S.keysafe_location, steps:[
      "Check you're using the code from my most recent message.",
      "Press each number firmly, then pull the lever down.",
      `It's ${S.keysafe_location ? S.keysafe_location.charAt(0).toLowerCase() + S.keysafe_location.slice(1) : ""}`],
      msg:"The keysafe won't open. I'm using the code you sent.", aka:"keysafe not opening keysafe code not working lockbox wont open code wrong cant open keysafe key box", urgent:true, label:"Message"},
    {id:"fix-safe", title:"The safe won't open", show: S.safe_spot, steps:[

    {id:"fix-hotwater", title:"No hot water", show: true, steps:[
      S.hot_water,
      "If the lights work too, the heater has power. If nothing works, see Power is off below."],
      msg:"There's no hot water. I've checked the power is on.", aka:"no hot water cold water cold shower boiler heater"},
    {id:"fix-power", title:"Power is off", show: S.fusebox_spot || S.fuse_box, steps:[
      S.fusebox_spot ? `Check the fuse box, ${S.fusebox_spot}. If a switch has dropped, push it back up.` : `${S.fuse_box} If a switch has dropped, push it back up.`,
      "If it drops again straight away, unplug the last thing you switched on, such as the kettle, oven or air conditioning, and try again.",
      "If the whole street is dark, it's a power cut. They're usually short."],
      msg:"The power is off. I've checked the fuse box.", aka:"power cut no electricity no power blackout fuse tripped lights not working", urgent:true},
    {id:"fix-lockout", title:"Locked out", show: true, steps:[
      "Please don't force a door or window.",
      "Send me a message with where you are, and I'll get you back in as soon as I can."],
      msg:`We're locked out of the ${PLACE}.`, aka:"locked out lost key keys inside cant get in door wont open", urgent:true, label:"Message"},
    {id:"fix-ac", title:"Air conditioning isn't cooling", show: S.ac_info, steps:[
      "Check the remote shows Cool, the snowflake, and is set to 23 to 24 degrees.",
      "Close the windows and doors in that room.",
      "Give it 15 minutes. Still warm air? Switch it off at the remote, wait a minute and switch it on again."],
      msg:"The air conditioning isn't cooling. It's on Cool with the doors and windows closed.", aka:"aircon not working ac not cooling air conditioning not working too hot"},
    {id:"fix-leak", title:"Water leak", show: S.valve_spot, steps:[
      `Turn off the water at the main valve, ${S.valve_spot}.`,
      "Move anything valuable away from the water and put towels down."],
      msg:"There's a water leak. I've turned off the main valve.", aka:"water leak leaking flood flooding burst pipe", urgent:true},
    {id:"fix-toilet", title:"Toilet is blocked", show: true, steps:[
      "Please don't flush again until it clears.",
      S.plunger_spot ? `There's a plunger ${S.plunger_spot}.` : "",
      "Only toilet paper goes in the toilet. Everything else goes in the bin."],
      msg:"The toilet is blocked. I've stopped flushing.", aka:"toilet blocked blocked toilet toilet wont flush clogged drain blocked"}
  ].filter(f => f.show);
  const ORDER = ["fix-wifi", "fix-keysafe", "fix-lockout", "fix-safe", "fix-hotwater", "fix-power", "fix-ac", "fix-toilet", "fix-leak"];
  FIX.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));

// ---- App bar: clear over the Home photo, solid navy once it scrolls away ----
const appbar = $("#appbar");
let current = null;
function syncBar(){
  syncFab();
  if (current !== "home"){ appbar.classList.remove("clear"); syncFab(); return; }
  const cover = $("#panel-home .cover");

// Home has its own WhatsApp button under the house manager, so the floating one only shows on the other tabs.
// It shows the word WhatsApp at the top of each tab, then shrinks to a circle while the guest reads.
function syncFab(){ const f = document.getElementById("wa-fab"); if (!f) return; f.classList.toggle("away", current === "home"); f.classList.toggle("ext", window.scrollY < 160); }
let ticking = false;
window.addEventListener("scroll", () => { if (!ticking){ ticking = true; requestAnimationFrame(() => { syncBar(); ticking = false; }); } }, {passive:true});

// ---- Tabs ----
const TABIDS = TABS.map(x => x.id);
const scrollPos = {};
function show(tab, opts){
  opts = opts || {};
  if (current && current !== tab) scrollPos[current] = window.scrollY;
  TABIDS.forEach(id => {
    $("#panel-" + id).hidden = id !== tab;
    const b = $(`.tab[data-tab="${id}"]`);
    if (id === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  const same = current === tab;
  current = tab;
  if (!opts.noScroll) window.scrollTo(0, same ? 0 : (scrollPos[tab] || 0));
  syncBar();
  store.set("gp2." + SCOPE + ".tab", tab);
  if (location.hash.slice(1) !== tab){ try { history.replaceState(null, "", "#" + tab); } catch(e){} }
}

// ---- Copy ----

  if (!b) return;
  const reset = label => { b.textContent = label; b.classList.add("done"); setTimeout(() => { b.textContent = "Copy"; b.classList.remove("done"); }, 1500); };
  const fallback = () => {
    const el = document.getElementById(b.dataset.sel);
    if (el){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    reset("Selected");
  };
  try { navigator.clipboard.writeText(b.dataset.copy).then(() => reset("Copied"), fallback); } catch(err){ fallback(); }
});

});

    const b = ch.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    const c = b ? b[0] : "";

  }
  return {text, map};
}

    if (h.e.isTip){ k.innerHTML = WM; k.appendChild(document.createTextNode(h.e.kicker)); } else k.textContent = h.e.kicker;

    b.append(k, t, snippet(h.e, h.m));

    out.appendChild(b);
  });
}

function jump(entry, m){
  // The search screen's history entry is kept: back from here returns to where the guest searched from.
  closeSearch(true);
  if (entry.tab !== "help") ovDrop();
  const el = document.getElementById(entry.id);
  if (!el) return;
  // A match inside a North American line shows that line, whatever region is set.
  if (entry.na && m && m.first){ const pos = entry.nX.map[m.first.at]; if (entry.na.some(r => pos >= r[0] && pos < r[1])) el.classList.add("na-open"); }
  if (entry.tab === "help"){ openSheet(sheet, $("#help-done"), true); }
  else { show(entry.tab, {noScroll:true}); }
  const view = el.closest(".view"); if (view && view.hidden) setView(view.dataset.view);
  const hidden = el.closest(".more-hidden");
  if (hidden){ hidden.hidden = false; const btn = hidden.parentElement.nextElementSibling; if (btn && btn.classList.contains("more")) btn.remove(); }
  const det = el.matches("details") ? el : el.closest("details");
  if (det) det.open = true;
  const smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  requestAnimationFrame(() => {
    el.scrollIntoView({block:"start", behavior: smooth ? "smooth" : "auto"});
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  });
}

// ---- Region: Europe (as written), United States, Canada ----
// Times are replaced (4 PM), because nothing on site needs 16h00 once the guest knows.
// Km, km/h and degrees keep the local figure and add the US one, because that is what road signs, the car and the AC remote show.
const ORIG = new WeakMap();
const clock12 = (h, mm) => `${h % 12 === 0 ? 12 : h % 12}${mm === "00" ? "" : ":" + mm} ${h < 12 ? "AM" : "PM"}`;
function toNA(t, region){
  // Clock times only: 7h00 to 23h30 and 00h00 style. Durations such as 1h45 stay as they are.
  t = t.replace(/\b([6-9]|[01]\d|2[0-3])h(00|15|30|45)\b/g, (m, h, mm) => clock12(+h, mm));
  return region === "us" ? toUS(t) : t;
}
function toUS(t){
  t = t.replace(/(\d+(?:[.,]\d+)?)\s?km\/h/g, (m, n) => `${m} (${Math.round(parseFloat(n.replace(",", ".")) * 0.621)} mph)`);
  t = t.replace(/(\d+(?:[.,]\d+)?)\s?km\b(?!\/)/g, (m, n) => { const v = parseFloat(n.replace(",", ".")) * 0.621; return `${m} (${v < 10 ? v.toFixed(1).replace(/\.0$/, "") : Math.round(v)} mi)`; });
  t = t.replace(/(\d+)(\s+to\s+(\d+))?\s+degrees/g, (m, a, _, b) => { const f = x => Math.round(x * 9 / 5 + 32); return `${m} (${f(+a)}${b ? " to " + f(+b) : ""} °F)`; });
  return t;
}
let CUR_REGION = null;
function applyRegion(region, persist){
  CUR_REGION = region;
  const na = region === "us" || region === "ca";
  document.documentElement.classList.toggle("na-on", na);
  [document.querySelector("main"), sheet].forEach(root => {
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n => n.parentElement && n.parentElement.closest("[data-nounits]") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
    const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach(n => { if (!ORIG.has(n)) ORIG.set(n, n.nodeValue); const o = ORIG.get(n); const v = na ? toNA(o, region) : o; if (n.nodeValue !== v) n.nodeValue = v; });
  });
  rsheet.querySelectorAll("input[name=region]").forEach(r => { r.checked = r.value === region; });
  if (persist !== false) store.set("gp2.region", region);
}
(function(){
  let saved = store.get("gp2.region");
  applyRegion(saved || "eu", !!saved);
  // Phone language is not a country: many Europeans run English (US). Ask once, never assume.
  const langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""]).map(x => String(x).toLowerCase());
  const ask = document.getElementById("units-ask");
  if (!saved && langs.some(l => l === "en-us" || l === "en-ca" || l === "fr-ca")) ask.hidden = false;
  ask.addEventListener("click", e => { const b = e.target.closest("[data-region]"); if (!b) return; applyRegion(b.dataset.region); ask.hidden = true; });
  rsheet.addEventListener("change", e => { if (e.target.name === "region"){ applyRegion(e.target.value); ask.hidden = true; } });
})();
